services:
  - type: web
    name: rekt-ceo-brandification
    runtime: node
    plan: starter
    region: oregon
    rootDir: rekt_brandify
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: AGENTCASH_WALLET_BASE64
        sync: false
      - key: X402_RECEIVER_ADDRESS
        sync: false
      - key: X402_FACILITATOR_URL
        value: https://api.cdp.coinbase.com/platform/v2/x402
      - key: X402_PRICE_SESSION_START
        value: "0.19"
      - key: X402_PRICE_GENERATE
        value: "0.49"
      - key: X402_PRICE_RATE
        value: "0.01"
      - key: X402_NETWORK
        value: base
      - key: CORS_ORIGINS
        sync: false
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
